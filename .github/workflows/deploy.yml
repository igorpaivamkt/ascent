# Publica o ASCENT no GitHub Pages a cada push na branch main.
# A URL e a chave pública (anon) do Supabase são públicas por natureza: a segurança vem do RLS e do login.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ASCENT_SUPABASE_URL: https://hncupryvymmtpmwvfmkt.supabase.co
  ASCENT_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuY3Vwcnl2eW1tdHBtd3ZmbWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTA0MTgsImV4cCI6MjEwOTE2NjQxOH0.1GFmJ8YjmqM6zLulqfAuj3amtSQYdwfGFqWMXHRDM5c

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Testes (domínio, sincronização e PostgreSQL real). Não bloqueiam a publicação.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
